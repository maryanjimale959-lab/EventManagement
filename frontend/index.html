<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EventMedia — Event Registration & Media Sharing</title>
    <meta
      name="description"
      content="Register guests, check them in at the door, and share the photos from your event with the people who were actually there."
    />
    <meta property="og:title" content="EventMedia — every event, remembered by the people who were there" />
    <meta property="og:description" content="Registration, door check-in and private photo galleries for your event." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/hero-crowd.jpg" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2312100d'/%3E%3Ccircle cx='16' cy='16' r='9' stroke='%23d19c3b' stroke-width='2.5' fill='none'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23d19c3b'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&family=Fraunces:WONK,opsz,wght@0..1,9..144,400..700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the theme before first paint, otherwise a dark-mode user sees a
      // white flash while React boots. Dark is the default; a stored light
      // choice still wins.
      (function () {
        try {
          if (localStorage.getItem("ems_theme") !== "light") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
