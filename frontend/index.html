    <meta charset="UTF-8" />

      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230a0a0c'/%3E%3Cpath d='M11.5 8.5v15M21.5 8.5 13 16l8.5 7.5' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the theme before first paint, otherwise a dark-mode user sees a
      // white flash while React boots. Light is the default; a stored dark
      // choice still wins.
      (function () {
        try {
          if (localStorage.getItem("ems_theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
