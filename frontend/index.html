    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
    />
    <script>
      // Apply the theme before first paint, otherwise a dark-mode user sees a
      // white flash while React boots. Dark is the default; a stored light
      // choice still wins.
      (function () {
        try {
          if (localStorage.getItem("ems_theme") !== "light") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
